<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

<center>
<table border="1" cellpadding="20" style="background-color: rgb(136, 0, 0);">
    <tr>
        <td>

            <form style="background-color: red;">
                <table cellpadding="8">

                    <tr>
                        <th colspan="2">Registration Form</th>
                    </tr>

                    <tr>
                        <td>First Name :</td>
                        <td><input class="firstName" type="text" name="fname"></td>
                    </tr>

                    <tr>
                        <td>Last Name :</td>
                        <td><input class="lastName" type="text" name="lname"></td>
                    </tr>

                    <tr>
                        <td>Father's Name :</td>
                        <td><input class="fatherName" type="text" name="faname"></td>
                    </tr>

                    <tr>
                        <td>Mother's Name :</td>
                        <td><input class="motherName" type="text" name="mname"></td>
                    </tr>

                    <tr>
                        <td>Date of Birth :</td>
                        <td><input class="date" type="date"></td>
                    </tr>

                    <tr>
                        <td>Email :</td>
                        <td><input class="email" type="email" name="email"></td>
                    </tr>

                    <tr>
                        <td>Gender :</td>
                        <td>
                            <input type="radio" name="gender"> Male
                            <input type="radio" name="gender"> Female
                        </td>
                    </tr>

                    <tr>
                        <td>Choose Course :</td>
                        <td>
                            <select>
                                <option>B.Tech</option>
                                <option>B.Sc</option>
                                <option>B.Com</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>Hobbies :</td>
                        <td>
                            <input type="checkbox"> Reading
                            <input type="checkbox"> Singing
                            <input type="checkbox"> Sports
                        </td>
                    </tr>

                    <tr>
                        <td>Address :</td>
                        <td><textarea rows="5" cols="30"></textarea></td>
                    </tr>

                    <tr>
                        <td>Upload Photo :</td>
                        <td><input type="file"></td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <button style="background-color: yellow; border: none; padding: 10px; margin-left:320px;">Submit</button>
                        </td>
                    </tr>

                </table>
            </form>

        </td>
    </tr>
</table>
</center>


<script>
    
</script>
</body>
</html>

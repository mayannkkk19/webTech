<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-columns: 400px 400px 400px;
            column-gap: 10px;
            row-gap: 20px;;
        }
        div {
            position: relative;
            background-image: url(../assets/images);
        }
        img {
            width: 400px;
            height: 300px;;
            object-fit: cover;
        }
        .imgName {
            background-image: url(../assets/4);
            position: absolute;
            height: 200px;
            width: 200px;
            top: 50px;
            left: 100px;
        }
        .imgNameS {
            background-image: url(../assets/3);
            position: absolute;
            height: 140px;
            width: 140px;
            top: 35px;
            left: 30px;
        }
        .imgNameT {
            background-image: url(../assets/2);
            position: absolute;
            height: 35px;
            width: 35px;
            top: 50px;
            left: 50px;
        }
    </style>
</head>
<body>
    <div>
        <div class="imgName">
            <div class="imgNameS">
                <div class="imgNameT"></div>
            </div>
        </div>
    </div>
    <img src="../assets/2">
    <img src="../assets/3">
    <img src="../assets/4">
</body>
</html>
